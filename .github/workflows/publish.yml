name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  build-and-pack:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Set version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if ! echo "$TAG" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Cannot determine version from ref '$TAG'. Dispatch from a release or a semver tag (e.g. v1.2.3)."
            exit 1
          fi
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          echo "Publishing version $VERSION"

      - name: Build
        run: bun run build

      - name: Pack package tarball
        run: npm pack

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'

  publish:
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Publish to npm
        run: npm publish *.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
